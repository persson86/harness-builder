name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Bash syntax
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck -S warning
      - name: Scanner selftest
        run: bash payload/.claude/hooks/design-slop-scan.sh --selftest
      - name: Integration tests
        run: bash tests/integration.sh
